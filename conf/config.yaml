defaults:
  - dataset: cora
  - model: gcn
  - training: hypA
  - override hydra/job_logging: disabled
  - override hydra/hydra_logging: disabled
  - _self_

paths:
  data_dir: data/pyg

split:
  strategy: class_wise   # class_wise | random | hpstrat
  k: 4                   # number of folds (>= 2)
  seed: 42

hydra:
  run:
    dir: .
  output_subdir: null
